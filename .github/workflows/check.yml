name: Check Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tools
        run: python -m pip install -r requirements.txt
      - name: Check Python files
        run: python -m compileall -q pac-man.py src
